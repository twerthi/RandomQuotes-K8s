apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openshift-gitops-operator-randomquotes-petlife-test
  namespace: openshift-gitops
  annotations:
    argo.octopus.com/project: "openshift-gitops-operator-demo"
    argo.octopus.com/environment: "test" 
    argo.octopus.com/tenant: "pet-life" 
spec:
  project: default
  source:
    repoURL: https://github.com/twerthi/RandomQuotes-K8s.git
    targetRevision: HEAD
    path: helm
    helm:
      releaseName: randomquotes-petlife-test
      valueFiles:
        - tenants/petlife/test/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: randomquotes-petlife-test
  syncPolicy:
#    automated: 
#      prune: true
#      selfHeal: true
    syncOptions:
    - Validate=false
    - CreateNamespace=true