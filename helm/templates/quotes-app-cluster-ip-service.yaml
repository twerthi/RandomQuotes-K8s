apiVersion: v1
kind: Service
metadata:
  name: {{ include "my-new-chart.fullname" . }}-quotes-app-cluster-ip-service
  labels:
  {{- include "my-new-chart.labels" . | nindent 4 }}
  namespace: {{ .Values.namespaceOverride | default .Release.Namespace }}
spec:
  type: {{ .Values.quotesAppClusterIpService.type }}
  selector:
    component: randomquotes-web
    {{- include "my-new-chart.selectorLabels" . | nindent 4 }}
  ports:
  {{- .Values.quotesAppClusterIpService.ports | toYaml | nindent 2 }}
